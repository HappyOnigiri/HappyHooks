name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      # 成果物とタグを同じ merge コミットへ揃えるため、publish-release と同じ ref を checkout する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: release
      - name: Build release assets
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: make release RELEASE_VERSION="${RELEASE_BRANCH#release/}"
      # 成果物付きの公開は draft を経由するため、再実行に備えて毎回すべての成果物を渡す。
      # パスは scripts/build-release.sh の出力と一致させる。
      - uses: HappyOnigiri/ReleaseActions/actions/publish-release@06c18eee2121665d90b655561374255eda6e1c75
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          pr-body: ${{ github.event.pull_request.body }}
          target-commit: ${{ github.event.pull_request.merge_commit_sha }}
          assets: |
            artifacts/release/install.sh
            artifacts/release/uninstall.sh
            artifacts/release/hhx-darwin-arm64
            artifacts/release/checksums.txt
          github-token: ${{ secrets.GH_TOKEN }}
