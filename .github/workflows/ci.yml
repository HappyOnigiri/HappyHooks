name: CI

# pull_request はベースを絞らない。積み重ねた PR（main 以外がベースの PR）も検査するためである。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 検査ごとに 1 ジョブにし、所要時間を合計ではなく最も遅い 1 つにする。
# 各ジョブは Makefile のターゲットを 1 つ走らせ、検査の定義を Makefile に一本化する。
#
# Go のキャッシュはジョブごとの名前空間に分け、main か、復元できなかったときだけ保存する。
# PR の実行は main の小さく温まったキャッシュを復元し、アップロードの時間を払わない。
jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: go-lint
            go: true
            go-cache-extra-paths: |
              ~/.cache/golangci-lint
              bin/golangci-lint
          - target: go-deadcode
            go: true
          - target: lines-check
            go: true
          - target: markdown-lint
            go: true
          - target: mod-tidy-check
            go: true
          # actionlint は run: の中身を shellcheck に渡すので、同じ固定版の shellcheck を入れる。
          - target: workflow-lint
            go: true
            shellcheck: true
            go-cache-extra-paths: bin/actionlint
          - target: workflow-security-audit
          - target: shell-check
            shellcheck: true
          # citest-profile を持つジョブは、落ちたテストだけを 1 回再実行する citest 経由でテストを走らせ、
          # 報告を artifact に上げる。名前は report-flaky-tests.cjs が照合する契約である。
          - target: test-race-coverage
            go: true
            citest-profile: race-coverage
          - target: test-ja
            go: true
          - target: release-check
            go: true
          # git describe がタグを読めるよう、このジョブだけ履歴とタグを取得する。
          - target: version-check
            go: true
            full-history: true
          - target: install-test
          - target: uninstall-test
          - target: reporter-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 数値の 0 は式の中で偽になるので、文字列で渡す。
          fetch-depth: ${{ matrix.full-history && '0' || '1' }}
          persist-credentials: false
      - name: Set up Go
        if: matrix.go
        id: go
        uses: ./.github/actions/setup-go
        with:
          cache-name: ${{ matrix.target }}
          extra-cache-paths: ${{ matrix.go-cache-extra-paths }}
      # ランナーに入っている shellcheck は版が違い、指摘が変わり得る。
      # 版は .tool-versions から読み、sha256 はその版の linux.x86_64 のアーカイブの値を置く。
      - name: Install pinned ShellCheck
        if: matrix.shellcheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          version="$(awk '$1 == "shellcheck" { print $2 }' .tool-versions)"
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            --output "$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xf "$archive"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
      - name: Build CI test runner
        if: matrix.citest-profile
        run: go build -trimpath -o bin/citest ./tools/citest
      - run: make ${{ matrix.target }}
        env:
          CITEST: ${{ matrix.citest-profile && 'bin/citest' || '' }}
      # 再実行で通ったテストは CI を落とさないので、flaky の記録はこの artifact にだけ残る。
      # report-flaky-tests.yml が CI の完了後にこれを読み、issue を起票する。
      - name: Upload CI test report
        if: ${{ always() && matrix.citest-profile }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tests-${{ matrix.citest-profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/${{ matrix.citest-profile }}
          if-no-files-found: error
          retention-days: 30
      - name: Verify CI is read-only
        run: |
          git diff --exit-code || {
            echo "::error::make ${{ matrix.target }} produced tracked file changes."
            git diff --stat
            exit 1
          }
      - name: Save Go caches
        if: ${{ !cancelled() && matrix.go && (github.ref == 'refs/heads/main' || steps.go.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}
