name: Report flaky tests

# CI のテストは citest 経由で走り、落ちたテストだけを 1 回再実行する。再実行で通ったテストは
# CI を落とさず、artifact の報告にだけ残る。このワークフローはそれを読み、テストごとに issue を起票する。
#
# workflow_run で起動したワークフローは既定ブランチの定義で動く。PR の中でこのファイルや
# reporter を変えても、その PR の CI の完了では古い定義が動く。
#
# workflows: の名前は ci.yml の name: と一致していなければ静かに発火しなくなる。
# `make reporter-check` が両者を突き合わせる。
on:
  # zizmor: ignore[dangerous-triggers] fork の run を除外し、既定ブランチの reporter だけを動かす（下の report ジョブ）。
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Source CI run ID
        required: true
        type: string
      run_attempt:
        description: Source CI run attempt
        required: true
        type: string

concurrency:
  group: hhx-flaky-test-reports
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  report:
    permissions:
      contents: read
      actions: read
      issues: write
      # issue に PR のリンクを残すため、head のブランチから PR を探す。
      pull-requests: read
    # fork の PR の CI は PR 側の ci.yml で動き、artifact の中身を PR の作成者が自由に作れる。
    # 起票や閉じた issue の開き直しに使われないよう、fork の run は対象外にする。
    # fork で見つかった flaky は、メンテナが workflow_dispatch で明示的に拾う。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # artifact は fork の PR からも届くので、reporter は PR 側ではなく既定ブランチのものを使う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reporter = require('./.github/scripts/report-flaky-tests.cjs');
            await reporter.run({
              github,
              context,
              core,
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceAttempt: process.env.SOURCE_RUN_ATTEMPT,
            });
